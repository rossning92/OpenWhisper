plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ross.speechtotext'
    compileSdk 34
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId "com.ross.speechtotext"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
                targets 'offline-transcriber'
            }
        }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.31.6'
        }
    }

    lintOptions {
        // workaround: disable lint on release builds because the lint tool crashes with Java 26
        checkReleaseBuilds false
        abortOnError false
    }

    buildTypes {
        release {
            // sign release builds with debug key so it can be installed easily
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
